name: 自動抓價
on:
  schedule:
    - cron: '17 1 * * 1'   # 每週一 01:17 UTC（台灣 09:17）
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - run: node scripts/fetch-ebay.mjs
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
      - name: 有變化才提交
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "bag-market bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/
            git commit -m "自動抓價 $(date -u +%F)"
            git push
          else
            echo "沒有新資料"
          fi
